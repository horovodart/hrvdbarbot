<title>Бар HOROVOD HUB</title>
<meta name="description" content="Склад напитков скушобни: остатки, закупки и подсчёт раз в 2 недели">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@600;700&display=swap">
<style>
:root{
  --bg:#F3F4F7; --surface:#FFFFFF; --surface-2:#EBEDF2; --ink:#14161B; --ink-2:#5B6070; --line:#E1E4EB;
  --accent:#2F4FE0; --accent-ink:#FFFFFF; --accent-soft:#E6EAFD;
  --red:#D92D3A; --red-soft:#FDE7E9; --amber:#B86E00; --amber-soft:#FFF1D6; --green:#1E8A56; --green-soft:#E0F4EA;
  --shadow:0 1px 2px rgba(20,22,27,.06),0 4px 14px rgba(20,22,27,.05);
  --display:"Unbounded","Onest",system-ui,sans-serif; --body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1115; --surface:#181B21; --surface-2:#22262E; --ink:#EEF0F4; --ink-2:#9AA0AE; --line:#2A2E37;
  --accent:#7B91FF; --accent-ink:#0F1115; --accent-soft:#1E2442;
  --red:#FF6B74; --red-soft:#3A1A1E; --amber:#F2B34A; --amber-soft:#3A2C12; --green:#4CC38A; --green-soft:#12301F;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{
  --bg:#0F1115; --surface:#181B21; --surface-2:#22262E; --ink:#EEF0F4; --ink-2:#9AA0AE; --line:#2A2E37;
  --accent:#7B91FF; --accent-ink:#0F1115; --accent-soft:#1E2442;
  --red:#FF6B74; --red-soft:#3A1A1E; --amber:#F2B34A; --amber-soft:#3A2C12; --green:#4CC38A; --green-soft:#12301F;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);-webkit-font-smoothing:antialiased}
.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.num{font-variant-numeric:tabular-nums}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;margin-inline:-16px;padding-inline:16px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand h1{font:700 19px/1.1 var(--display);letter-spacing:-.01em;margin:0}
.brand h1 span{color:var(--accent)}
.brand small{color:var(--ink-2);font-size:12.5px;text-align:right}
.alerts{display:flex;gap:8px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.chip{flex:none;border:0;border-radius:999px;padding:6px 12px;font:600 13px var(--body);background:var(--surface);color:var(--ink);box-shadow:var(--shadow);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
h2.sec{font:600 13px/1 var(--display);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);margin:22px 0 10px;display:flex;justify-content:space-between;align-items:baseline}
h2.sec em{font:500 12.5px var(--body);text-transform:none;letter-spacing:0;font-style:normal}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:520px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;cursor:pointer;border:0;padding:0;text-align:left;color:inherit;font:inherit;display:flex;flex-direction:column}
.card:focus-visible,.btn:focus-visible,.chip:focus-visible,.tab:focus-visible,.step button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.thumb{position:relative;aspect-ratio:4/3;max-width:100%;background:color-mix(in srgb,var(--c) 16%,var(--surface-2));display:grid;place-items:center}
.thumb svg{height:78%;width:auto}
.card.out .thumb svg{opacity:.35;filter:grayscale(.6)}
.flag{position:absolute;left:8px;top:8px;border-radius:8px;padding:3px 8px;font:700 11.5px var(--body);letter-spacing:.01em}
.flag.red{background:var(--red);color:#fff}
.flag.amber{background:var(--amber-soft);color:var(--amber)}
.price{position:absolute;right:8px;bottom:8px;background:var(--surface);color:var(--ink);border-radius:8px;padding:2px 7px;font:600 12px var(--body)}
.cb{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px;flex:1}
.cb .nm{font-weight:600;line-height:1.25}
.cb .vol{color:var(--ink-2);font-size:12.5px}
.cb .stk{margin-top:6px;display:flex;align-items:baseline;gap:6px}
.cb .stk b{font:700 20px/1 var(--display)}
.cb .stk span{color:var(--ink-2);font-size:12.5px}
.cb .stk.red b{color:var(--red)} .cb .stk.amber b{color:var(--amber)}
.panel{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:14px}
.row{display:flex;align-items:center;gap:12px;padding-block:10px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .mini{width:40px;height:40px;border-radius:10px;flex:none;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 16%,var(--surface-2))}
.row .mini svg{height:32px;width:auto}
.row .info{flex:1;min-width:0}
.row .info .nm{font-weight:600;line-height:1.2}
.row .info .sub{color:var(--ink-2);font-size:12.5px}
.step{display:flex;align-items:center;gap:4px;flex:none}
.step button{width:34px;height:34px;border-radius:10px;border:0;background:var(--surface-2);color:var(--ink);font:600 18px var(--body);cursor:pointer}
.step button.plus{background:var(--accent-soft);color:var(--accent)}
.step input{width:52px;height:34px;text-align:center;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:600 15px var(--body);font-variant-numeric:tabular-nums}
.step input.changed{border-color:var(--accent)}
.btn{border:0;border-radius:14px;padding:14px 18px;font:600 15px var(--body);cursor:pointer;background:var(--accent);color:var(--accent-ink);width:100%}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn[disabled]{opacity:.45;cursor:default}
.dock{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:6;padding:10px 16px}
.dock .btn{max-width:528px;margin:0 auto;display:block;box-shadow:0 6px 20px rgba(47,79,224,.3)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{border:0;background:none;color:var(--ink-2);font:600 11.5px var(--body);padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.tab svg{width:22px;height:22px}
.tab[aria-selected="true"]{color:var(--accent)}
.field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.field label{font-size:12.5px;color:var(--ink-2);font-weight:500}
.field input,.field select{height:42px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:0 12px;font:500 15px var(--body);width:100%}
.fields{display:flex;gap:10px;flex-wrap:wrap}
.recon{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px}
.recon dt{color:var(--ink-2)} .recon dd{margin:0;text-align:right;font-weight:600}
.recon .tot{border-top:1px solid var(--line);padding-top:8px;font-size:15px}
.pos{color:var(--green)} .neg{color:var(--red)}
.note{color:var(--ink-2);font-size:12.5px;line-height:1.45}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font:600 12px var(--body)}
.pill.red{background:var(--red-soft);color:var(--red)} .pill.amber{background:var(--amber-soft);color:var(--amber)} .pill.green{background:var(--green-soft);color:var(--green)}
.hist{display:flex;flex-direction:column;gap:12px}
.hist .h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.hist .h b{font-weight:700}
.del{border:0;background:none;color:var(--ink-2);font:500 12.5px var(--body);cursor:pointer;padding:4px}
.del.armed{color:var(--red);font-weight:700}
.sheet-bg{position:fixed;inset:0;background:rgba(10,12,16,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom,0px));max-height:85vh;overflow:auto}
.sheet .hd{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.sheet .hd .mini{width:64px;height:64px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 16%,var(--surface-2));flex:none}
.sheet .hd .mini svg{height:52px;width:auto}
.sheet h3{font:700 17px/1.2 var(--display);margin:0}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-block:12px}
.kv div{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.kv small{display:block;color:var(--ink-2);font-size:12px}
.kv b{font:700 17px/1.3 var(--display)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:30}
.empty{padding:40px 8px;text-align:center;color:var(--ink-2)}
.stack{display:flex;flex-direction:column;gap:12px}
@media (prefers-reduced-motion:no-preference){.card{transition:transform .12s}.card:active{transform:scale(.98)}}
</style>

<div class="app" id="app">
  <header class="top">
    <div class="brand"><h1>HOROVOD <span>HUB</span> · бар</h1><small id="lastCount" class="num">загрузка…</small></div>
    <div class="alerts" id="alerts"></div>
  </header>
  <main id="view"><div class="empty">Загружаю склад…</div></main>
</div>
<div class="dock" id="dock" hidden><button class="btn" id="dockBtn"></button></div>
<nav class="tabs" aria-label="Разделы"><div class="in" role="tablist">
  <button class="tab" role="tab" data-tab="menu" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg>Меню</button>
  <button class="tab" role="tab" data-tab="buy" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14l-1.5 12h-11z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>Закупка</button>
  <button class="tab" role="tab" data-tab="count" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 9h6M9 13h6M9 17h3"/></svg>Подсчёт</button>
  <button class="tab" role="tab" data-tab="hist" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>История</button>
</div></nav>

<script>
(function(){
const SALE_PRICE=1.5, HORIZON=14, TARGET=28;
const CAT={sale:"По 1,50 €",free:"Вода · бесплатно",shared:"Общие · не продаются"};
const S={f:{},products:[],counts:[],purchases:[],tab:"menu",filter:"all",buy:{},count:null,db:null,ready:{p:0,c:0,u:0}};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const eur=n=>(n<0?"−":"")+Math.abs(n).toFixed(2).replace(".",",")+" €";
const ddmm=iso=>{const d=new Date(iso);return String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")};
const days=(a,b)=>(new Date(b)-new Date(a))/864e5;
const plural=(n,a,b,c)=>{n=Math.abs(n)%100;const m=n%10;if(n>10&&n<20)return c;if(m>1&&m<5)return b;if(m==1)return a;return c};

function art(p,big){
  const c=p.color||"#888", k=p.shape||"can";
  if(k==="can") return `<svg viewBox="0 0 40 64"><rect x="6" y="6" width="28" height="54" rx="6" fill="${c}"/><rect x="9" y="3" width="22" height="6" rx="3" fill="#B9BEC8"/><rect x="6" y="24" width="28" height="16" fill="#fff" opacity=".85"/><rect x="12" y="29" width="16" height="6" rx="2" fill="${c}"/></svg>`;
  if(k==="bottle") return `<svg viewBox="0 0 30 72"><rect x="11" y="2" width="8" height="5" rx="1.5" fill="#C9A43A"/><path d="M11 7h8v12c0 4 7 7 7 13v34a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4V32c0-6 7-9 7-13z" fill="${c}"/><rect x="4" y="40" width="22" height="16" fill="#fff" opacity=".85"/><rect x="8" y="45" width="14" height="6" rx="2" fill="${c}"/></svg>`;
  if(k==="pet") return `<svg viewBox="0 0 34 80"><rect x="12" y="2" width="10" height="6" rx="2" fill="${p.cap||"#E43"}"/><path d="M12 8h10v6c0 3 8 6 8 13v47a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4V27c0-7 8-10 8-13z" fill="${c}" opacity=".92"/><rect x="4" y="36" width="26" height="18" fill="#fff" opacity=".8"/><rect x="8" y="42" width="18" height="6" rx="2" fill="${c}"/></svg>`;
  if(k==="water") return `<svg viewBox="0 0 34 80"><rect x="12" y="2" width="10" height="6" rx="2" fill="#2B6CB0"/><path d="M12 8h10v6c0 3 8 6 8 13v47a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4V27c0-7 8-10 8-13z" fill="${c}" opacity=".45"/><rect x="4" y="38" width="26" height="14" fill="${c}"/><path d="M4 60h26M4 66h26" stroke="#fff" stroke-width="1.5" opacity=".6"/></svg>`;
  if(k==="capsule") return `<svg viewBox="0 0 64 64"><ellipse cx="32" cy="46" rx="24" ry="8" fill="${c}" opacity=".5"/><path d="M10 44 L18 18 H46 L54 44 Z" fill="${c}"/><ellipse cx="32" cy="18" rx="14" ry="4" fill="#D9B98C"/><ellipse cx="32" cy="44" rx="22" ry="6" fill="${c}"/></svg>`;
  return `<svg viewBox="0 0 40 64"><rect x="6" y="10" width="28" height="48" rx="4" fill="${c}"/><path d="M6 18 L20 4 L34 18" fill="${c}"/><rect x="6" y="28" width="28" height="12" fill="#fff" opacity=".6"/></svg>`;
}

/* ---------- расчёты ---------- */
function model(){
  const counts=[...S.counts].sort((a,b)=>a.date<b.date?-1:1);
  const purch=[...S.purchases].sort((a,b)=>a.date<b.date?-1:1);
  const sumP=(from,to)=>{const o={};for(const x of purch){if((from==null||x.date>from)&&(to==null||x.date<=to))for(const[k,v]of Object.entries(x.items||{}))o[k]=(o[k]||0)+(+v||0)}return o};
  // сверки по каждой паре подсчётов
  const recs=[];
  for(let i=1;i<counts.length;i++){
    const a=counts[i-1],b=counts[i],bought=sumP(a.date,b.date),cons={};let saleUnits=0;
    for(const p of S.products){
      if(a.stock?.[p.id]==null||b.stock?.[p.id]==null)continue;
      const v=(+a.stock[p.id])+(bought[p.id]||0)-(+b.stock[p.id]);cons[p.id]=v;
      if(p.cat==="sale")saleUnits+=v;
    }
    const expected=saleUnits*SALE_PRICE,got=(+b.cash||0)+(+b.card||0);
    recs.push({from:a,to:b,days:days(a.date,b.date),cons,bought,saleUnits,expected,got,diff:got-expected});
  }
  const last=counts[counts.length-1],lastRec=recs[recs.length-1];
  const since=last?sumP(last.date,null):sumP(null,null);
  const dSince=last?Math.max(0,days(last.date,new Date().toISOString())):0;
  const items={};
  for(const p of S.products){
    const base=last?.stock?.[p.id];
    let rate=null;
    if(lastRec&&lastRec.cons[p.id]!=null&&lastRec.days>0)rate=Math.max(0,lastRec.cons[p.id]/lastRec.days);
    const exact=(base??0)+(since[p.id]||0);
    let est=exact; if(rate!=null)est=Math.max(0,exact-rate*dSince);
    const estimated=rate!=null&&dSince>=1&&rate>0;
    const daysLeft=rate>0?est/rate:null;
    let st="green";
    if(Math.round(est)<=0)st="red";
    else if(daysLeft!=null){if(daysLeft<HORIZON)st="red";else if(daysLeft<HORIZON+7)st="amber";}
    else if(p.min!=null){if(est<=p.min)st="red";else if(est<=p.min*1.5)st="amber";}
    let need=0;
    if(rate>0)need=Math.max(0,rate*TARGET-est);else if(st!=="green"&&p.min)need=p.min*2-est;
    if(need>0&&p.pack)need=Math.ceil(need/p.pack)*p.pack;else need=Math.ceil(need);
    items[p.id]={est,estimated,rate,daysLeft,st,need,bought:since[p.id]||0};
  }
  return{counts,purch,recs,last,items,dSince};
}

/* ---------- рендер ---------- */
function sorted(){return[...S.products].filter(p=>!p.hidden).sort((a,b)=>(a.order??99)-(b.order??99))}
function badge(it){
  if(it.st==="red")return`<span class="flag red">${Math.round(it.est)<=0?"Закончилось":"Докупить"}</span>`;
  if(it.st==="amber")return`<span class="flag amber">Скоро</span>`;return"";
}
function stockLine(it){
  const n=Math.round(it.est);
  let t=it.daysLeft!=null?(it.daysLeft>60?"хватит надолго":"≈ "+Math.floor(it.daysLeft)+" "+plural(Math.floor(it.daysLeft),"день","дня","дней")):"шт";
  return`<div class="stk ${it.st!=="green"?it.st:""}"><b class="num">${it.estimated?"≈":""}${n}</b><span>${it.daysLeft!=null?t:plural(n,"штука","штуки","штук")}</span></div>`;
}
function renderMenu(M){
  const all=sorted(),reds=all.filter(p=>M.items[p.id].st==="red"),ambers=all.filter(p=>M.items[p.id].st==="amber");
  $("#alerts").innerHTML=`<button class="chip" data-f="all" aria-pressed="${S.filter==="all"}">Все · ${all.length}</button>`+
   `<button class="chip" data-f="red" aria-pressed="${S.filter==="red"}"><span class="dot" style="background:var(--red)"></span>Докупить · ${reds.length}</button>`+
   `<button class="chip" data-f="amber" aria-pressed="${S.filter==="amber"}"><span class="dot" style="background:var(--amber)"></span>Скоро · ${ambers.length}</button>`;
  let html="";
  for(const cat of["sale","free","shared"]){
    let ps=all.filter(p=>p.cat===cat);
    if(S.filter!=="all")ps=ps.filter(p=>M.items[p.id].st===S.filter);
    if(!ps.length)continue;
    html+=`<h2 class="sec">${CAT[cat]}<em>${ps.length} ${plural(ps.length,"позиция","позиции","позиций")}</em></h2><div class="grid">`;
    for(const p of ps){const it=M.items[p.id];
      html+=`<button class="card ${Math.round(it.est)<=0?"out":""}" data-p="${esc(p.id)}"><div class="thumb" style="--c:${p.color}">${art(p)}${badge(it)}${cat==="sale"?'<span class="price">1,50 €</span>':cat==="free"?'<span class="price">0 €</span>':""}</div><div class="cb"><div class="nm">${esc(p.name)}</div><div class="vol">${esc(p.vol||"")}</div>${stockLine(it)}</div></button>`;}
    html+=`</div>`;
  }
  if(!html)html=`<div class="empty">В этом фильтре пусто — всё в порядке.</div>`;
  html+=`<p class="note" style="margin-top:18px">«≈» — расчётный остаток: последний подсчёт + закупки − средний расход с тех пор. Точным он становится в день подсчёта. Красное — запаса меньше чем на ${HORIZON} дней (до следующего подсчёта).</p>`;
  return html;
}
function stepper(id,val,cls){return`<div class="step"><button type="button" data-d="-1" data-id="${esc(id)}" aria-label="минус">−</button><input id="${cls}-${esc(id)}" inputmode="numeric" data-id="${esc(id)}" data-k="${cls}" value="${val}" class="num"><button type="button" class="plus" data-d="1" data-id="${esc(id)}" aria-label="плюс">+</button></div>`}
function renderBuy(M){
  const all=sorted(),needs=all.filter(p=>M.items[p.id].need>0);
  let h=`<h2 class="sec">Что купить<em>на ${TARGET} дней вперёд</em></h2><div class="panel">`;
  if(!needs.length)h+=`<div class="note">Пока ничего не требуется. Список появится, когда запас какой-то позиции станет меньше, чем на ${HORIZON} дней.</div>`;
  else{for(const p of needs){const it=M.items[p.id];h+=`<div class="row"><div class="mini" style="--c:${p.color}">${art(p)}</div><div class="info"><div class="nm">${esc(p.name)}</div><div class="sub num">сейчас ${Math.round(it.est)}${p.pack?" · упаковка "+p.pack:""}${p.cost?" · ~"+eur(it.need*p.cost):""}</div></div><span class="pill ${it.st==="green"?"green":it.st} num">+${it.need}</span></div>`}
    const tot=needs.reduce((s,p)=>s+(p.cost?M.items[p.id].need*p.cost:0),0);
    h+=`<div class="row"><div class="info"><div class="nm">Примерно по чекам Metro</div><div class="sub">цены без НДС, без залога 0,15 €</div></div><b class="num">${eur(tot)}</b></div>
    <button class="btn ghost" id="fillNeed" style="margin-top:8px">Перенести в закупку</button>`}
  h+=`</div><h2 class="sec">Отметить закупку<em>плюсами — что купил</em></h2><div class="panel">`;
  for(const cat of["sale","free","shared"])for(const p of all.filter(x=>x.cat===cat)){h+=`<div class="row"><div class="mini" style="--c:${p.color}">${art(p)}</div><div class="info"><div class="nm">${esc(p.name)}</div><div class="sub">${esc(p.vol||"")}${p.pack?" · упак. "+p.pack:""}</div></div>${stepper(p.id,S.buy[p.id]||0,"b")}</div>`}
  h+=`</div><div class="fields" style="margin-top:12px"><div class="field"><label for="buySum">Сумма чека, € (необязательно)</label><input id="buySum" value="${esc(S.f.buySum||"")}" inputmode="decimal" placeholder="например 97,48"></div><div class="field"><label for="buyWho">Кто купил</label><input id="buyWho" value="${esc(S.f.buyWho||"")}" placeholder="имя"></div></div>
  <details class="panel" style="margin-top:16px"><summary style="cursor:pointer;font-weight:600">+ Новый напиток</summary><div class="stack" style="margin-top:12px">
   <div class="fields"><div class="field"><label for="npName">Название</label><input id="npName" placeholder="Birell 0,0%"></div><div class="field"><label for="npVol">Объём</label><input id="npVol" placeholder="0,5 л, стекло"></div></div>
   <div class="fields"><div class="field"><label for="npCat">Категория</label><select id="npCat"><option value="sale">По 1,50 €</option><option value="free">Бесплатно</option><option value="shared">Общие, не продаются</option></select></div><div class="field"><label for="npShape">Тара</label><select id="npShape"><option value="bottle">Стекло</option><option value="can">Банка</option><option value="pet">ПЭТ</option><option value="water">Вода</option><option value="capsule">Капсула</option></select></div></div>
   <div class="fields"><div class="field"><label for="npCost">Закупка за шт, €</label><input id="npCost" inputmode="decimal"></div><div class="field"><label for="npPack">Упаковка, шт</label><input id="npPack" inputmode="numeric" value="6"></div><div class="field"><label for="npColor">Цвет</label><input id="npColor" type="color" value="#2F8F5B" style="padding:4px"></div></div>
   <button class="btn ghost" id="npAdd">Добавить в меню</button></div></details>`;
  return h;
}
function renderCount(M){
  const all=sorted();
  if(!S.count){S.count={};for(const p of all)S.count[p.id]=Math.round(M.items[p.id].est)}
  let h=`<h2 class="sec">Подсчёт раз в 2 недели<em>${M.last?"прошлый "+ddmm(M.last.date)+" · "+Math.floor(M.dSince)+" дн. назад":""}</em></h2><p class="note" style="margin:0 0 10px">Посчитай холодильник и полки вместе. Поля уже заполнены расчётом — поправь на то, что видишь.</p><div class="panel">`;
  for(const cat of["sale","free","shared"])for(const p of all.filter(x=>x.cat===cat)){
    const base=M.last?.stock?.[p.id],it=M.items[p.id];
    h+=`<div class="row"><div class="mini" style="--c:${p.color}">${art(p)}</div><div class="info"><div class="nm">${esc(p.name)}</div><div class="sub num">было ${base??"—"}${it.bought?" + куплено "+it.bought:""}</div></div>${stepper(p.id,S.count[p.id]??0,"c")}</div>`}
  h+=`</div><h2 class="sec">Деньги за эти 2 недели</h2><div class="fields"><div class="field"><label for="cCash">Касса (наличные), €</label><input id="cCash" value="${esc(S.f.cCash||"")}" inputmode="decimal" placeholder="0"></div><div class="field"><label for="cCard">На карту «napoj HUB», €</label><input id="cCard" value="${esc(S.f.cCard||"")}" inputmode="decimal" placeholder="0"></div></div>
  <div class="panel" style="margin-top:12px" id="preview"></div>
  <div class="field" style="margin-top:12px"><label for="cWho">Кто считал</label><input id="cWho" value="${esc(S.f.cWho||"")}" placeholder="имя"></div>
  <p class="note">После сохранения кассу опустоши — следующие 2 недели считаются с нуля.</p>`;
  return h;
}
function num(v){return parseFloat(String(v||"").replace(",","."))||0}
function previewCount(M){
  const el=$("#preview");if(!el)return;
  if(!M.last){el.innerHTML=`<div class="note">Это первый подсчёт — он станет точкой отсчёта.</div>`;return}
  let units=0,lines="";
  for(const p of sorted()){const base=M.last.stock?.[p.id];if(base==null)continue;const c=base+(M.items[p.id].bought)-(S.count[p.id]||0);if(p.cat==="sale")units+=c}
  let free=0;for(const p of sorted())if(p.cat==="free"&&M.last.stock?.[p.id]!=null)free+=M.last.stock[p.id]+M.items[p.id].bought-(S.count[p.id]||0);
  const exp=units*SALE_PRICE,got=num($("#cCash")?.value)+num($("#cCard")?.value),d=got-exp;
  el.innerHTML=`<dl class="recon num"><dt>Выпито платных</dt><dd>${units} шт</dd><dt>Воды выпито</dt><dd>${free} шт</dd><dt>Должно быть (× 1,50 €)</dt><dd>${eur(exp)}</dd><dt>Пришло: касса + карта</dt><dd>${eur(got)}</dd><dt class="tot">Разница</dt><dd class="tot ${d>=0?"pos":"neg"}">${d>0?"+":""}${eur(d)}${exp>0&&d<0?" · "+Math.round(-d/exp*100)+"% не оплачено":""}</dd></dl>`;
}
function renderHist(M){
  let ev=[...M.recs.map(r=>({t:"rec",date:r.to.date,r})),...M.purch.map(p=>({t:"buy",date:p.date,p}))];
  if(M.counts[0])ev.push({t:"first",date:M.counts[0].date,c:M.counts[0]});
  ev.sort((a,b)=>a.date<b.date?1:-1);
  if(!ev.length)return`<div class="empty">Пока пусто.</div>`;
  const name=id=>S.products.find(p=>p.id===id)?.name||id;
  let h=`<h2 class="sec">История</h2><div class="hist">`;
  for(const e of ev){
    if(e.t==="rec"){const r=e.r;const top=Object.entries(r.cons).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([k,v])=>`${esc(name(k))} ${v}`).join(" · ");
      h+=`<div class="panel"><div class="h"><b>Подсчёт ${ddmm(r.to.date)}</b><span class="pill ${r.diff>=0?"green":"red"} num">${r.diff>0?"+":""}${eur(r.diff)}</span></div><dl class="recon num"><dt>Период</dt><dd>${ddmm(r.from.date)}–${ddmm(r.to.date)} · ${Math.round(r.days)} дн.</dd><dt>Выпито платных</dt><dd>${r.saleUnits} шт</dd><dt>Должно быть</dt><dd>${eur(r.expected)}</dd><dt>Пришло</dt><dd>${eur(r.got)} <span class="note">(${eur(+r.to.cash||0)} + ${eur(+r.to.card||0)})</span></dd></dl><p class="note" style="margin:8px 0 0">${top}</p><div style="text-align:right">${r.to.by?`<span class="note">считал(а): ${esc(r.to.by)}</span>`:""} <button class="del" data-del="counts/${esc(r.to.id)}">удалить</button></div></div>`}
    else if(e.t==="buy"){const p=e.p;const list=Object.entries(p.items||{}).filter(([,v])=>v>0).map(([k,v])=>`${esc(name(k))} +${v}`).join(" · ");
      h+=`<div class="panel"><div class="h"><b>Закупка ${ddmm(p.date)}</b>${p.total?`<span class="num">${eur(+p.total)}</span>`:""}</div><p class="note" style="margin:0">${list}</p><div style="text-align:right">${p.by?`<span class="note">${esc(p.by)}</span>`:""} <button class="del" data-del="purchases/${esc(p.id)}">удалить</button></div></div>`}
    else h+=`<div class="panel"><div class="h"><b>Стартовый подсчёт ${ddmm(e.c.date)}</b></div><p class="note" style="margin:0">Точка отсчёта. Сверка денег начнётся со следующего подсчёта.</p></div>`;
  }
  return h+`</div>`;
}
function render(){
  if(!S.db){return}
  const M=model();S.M=M;
  $("#lastCount").textContent=M.last?`подсчёт ${ddmm(M.last.date)} · следующий ~${ddmm(new Date(new Date(M.last.date).getTime()+14*864e5).toISOString())}`:"подсчётов ещё не было";
  $("#alerts").hidden=S.tab!=="menu";
  const v=$("#view");
  if(!S.products.length){v.innerHTML=`<div class="empty">Меню пока пустое. Добавь первый напиток во вкладке «Закупка».</div>`;}
  if(S.tab==="menu"&&S.products.length)v.innerHTML=renderMenu(M);
  if(S.tab==="buy")v.innerHTML=renderBuy(M);
  if(S.tab==="count"){v.innerHTML=renderCount(M);previewCount(M)}
  if(S.tab==="hist")v.innerHTML=renderHist(M);
  dock();
}
function dock(){
  const d=$("#dock"),b=$("#dockBtn");
  if(S.tab==="buy"){const n=Object.values(S.buy).reduce((s,v)=>s+(+v||0),0);d.hidden=false;b.textContent=n?`Добавить на склад · ${n} шт`:"Отметь, что купил";b.disabled=!n;b.dataset.a="buy"}
  else if(S.tab==="count"){d.hidden=false;b.textContent="Сохранить подсчёт";b.disabled=false;b.dataset.a="count"}
  else d.hidden=true;
}
function toast(t){const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}
function sheet(p){
  const it=S.M.items[p.id],m=p.cat==="sale"&&p.cost?SALE_PRICE-p.cost:null;
  const bg=document.createElement("div");bg.className="sheet-bg";
  bg.innerHTML=`<div class="sheet" role="dialog" aria-label="${esc(p.name)}"><div class="hd"><div class="mini" style="--c:${p.color}">${art(p)}</div><div><h3>${esc(p.name)}</h3><div class="note">${esc(p.vol||"")} · ${CAT[p.cat]}</div></div></div>
  <div class="kv num"><div><small>Остаток</small><b>${it.estimated?"≈":""}${Math.round(it.est)} шт</b></div><div><small>Расход</small><b>${it.rate!=null?(it.rate*7).toFixed(1).replace(".",",")+" в нед.":"после 2-го подсчёта"}</b></div><div><small>Хватит на</small><b>${it.daysLeft!=null?Math.floor(it.daysLeft)+" дн.":"—"}</b></div><div><small>Купить на ${TARGET} дн.</small><b>${it.need?"+"+it.need:"не нужно"}</b></div>
  <div><small>Закупка за шт</small><b>${p.cost?eur(p.cost):"—"}</b></div><div><small>${p.cat==="sale"?"Маржа с шт":"Упаковка"}</small><b>${p.cat==="sale"?(m!=null?eur(m):"—"):(p.pack||"—")}</b></div></div>
  ${p.note?`<p class="note">${esc(p.note)}</p>`:""}
  <div class="fields" style="margin-top:6px"><div class="field"><label for="edCost">Закупка за шт, €</label><input id="edCost" inputmode="decimal" value="${p.cost??""}"></div><div class="field"><label for="edMin">Мин. остаток, шт</label><input id="edMin" inputmode="numeric" value="${p.min??""}"></div></div>
  <div class="fields" style="margin-top:12px"><button class="btn ghost" id="edClose" style="flex:1">Закрыть</button><button class="btn" id="edSave" style="flex:1">Сохранить</button></div>
  <button class="del" id="edHide" style="margin-top:10px">убрать из меню</button></div>`;
  document.body.appendChild(bg);
  const close=()=>bg.remove();
  bg.addEventListener("click",e=>{if(e.target===bg)close()});
  bg.querySelector("#edClose").onclick=close;
  bg.querySelector("#edSave").onclick=async()=>{try{await S.db.doc("products/"+p.id).update({cost:num(bg.querySelector("#edCost").value)||null,min:parseInt(bg.querySelector("#edMin").value)||null});toast("Сохранено");close()}catch(e){toast("Не сохранилось: "+e.code)}};
  const hb=bg.querySelector("#edHide");hb.onclick=async()=>{if(!hb.classList.contains("armed")){hb.classList.add("armed");hb.textContent="точно убрать? нажми ещё раз";return}try{await S.db.doc("products/"+p.id).update({hidden:true});toast("Убрано из меню");close()}catch(e){toast("Ошибка: "+e.code)}};
}

/* ---------- события ---------- */
document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-tab]");if(t){S.tab=t.dataset.tab;document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",x===t));if(S.tab==="count")S.count=null;render();scrollTo(0,0);return}
  const f=e.target.closest("[data-f]");if(f){S.filter=f.dataset.f;render();return}
  const c=e.target.closest(".card[data-p]");if(c){const p=S.products.find(x=>x.id===c.dataset.p);if(p)sheet(p);return}
  const s=e.target.closest(".step button");if(s){const id=s.dataset.id,inp=s.parentElement.querySelector("input"),v=Math.max(0,(parseInt(inp.value)||0)+(+s.dataset.d));inp.value=v;setVal(inp.dataset.k,id,v);return}
  if(e.target.id==="fillNeed"){for(const p of S.products){const n=S.M.items[p.id]?.need;if(n)S.buy[p.id]=n}render();toast("Список перенесён — поправь по чеку");return}
  const d=e.target.closest("[data-del]");if(d){if(!d.classList.contains("armed")){d.classList.add("armed");d.textContent="точно удалить?";return}try{await S.db.doc(d.dataset.del).delete();toast("Удалено")}catch(er){toast("Ошибка: "+er.code)}return}
  if(e.target.id==="npAdd")return addProduct();
  if(e.target.id==="dockBtn")return e.target.dataset.a==="buy"?saveBuy():saveCount();
});
document.addEventListener("input",e=>{const i=e.target;if(i.dataset?.k){setVal(i.dataset.k,i.dataset.id,Math.max(0,parseInt(i.value)||0),true)}if(["buySum","buyWho","cCash","cCard","cWho"].includes(i.id))S.f[i.id]=i.value;if(i.id==="cCash"||i.id==="cCard")previewCount(S.M)});
function setVal(k,id,v,typing){if(k==="b"){S.buy[id]=v;dock()}else{S.count[id]=v;previewCount(S.M)}const el=document.getElementById(k+"-"+id);if(el)el.classList.toggle("changed",k==="b"?v>0:v!==Math.round(S.M.items[id].est))}
async function saveBuy(){
  const items={};for(const[k,v]of Object.entries(S.buy))if(v>0)items[k]=v;if(!Object.keys(items).length)return;
  const b=$("#dockBtn");b.disabled=true;
  try{await S.db.collection("purchases").add({date:new Date().toISOString(),items,total:num($("#buySum")?.value)||null,by:$("#buyWho")?.value.trim()||null});S.buy={};S.f.buySum="";toast("Закупка добавлена на склад");S.tab="menu";document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",x.dataset.tab==="menu"));render()}
  catch(e){toast("Не сохранилось: "+e.code);b.disabled=false}
}
async function saveCount(){
  const stock={};for(const p of sorted())stock[p.id]=S.count[p.id]||0;
  const b=$("#dockBtn");b.disabled=true;
  try{await S.db.collection("counts").add({date:new Date().toISOString(),stock,cash:num($("#cCash").value),card:num($("#cCard").value),by:$("#cWho").value.trim()||null});S.count=null;S.f.cCash=S.f.cCard="";toast("Подсчёт сохранён");S.tab="hist";document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",x.dataset.tab==="hist"));render()}
  catch(e){toast("Не сохранилось: "+e.code);b.disabled=false}
}
async function addProduct(){
  const name=$("#npName").value.trim();if(!name){toast("Впиши название");return}
  const id=name.toLowerCase().replace(/[^a-z0-9а-я]+/gi,"-").replace(/^-|-$/g,"").slice(0,40)+"-"+Date.now().toString(36);
  const safe=id.replace(/[^A-Za-z0-9_\-]/g,c=>c.charCodeAt(0).toString(36));
  const cat=$("#npCat").value;
  try{await S.db.doc("products/"+safe).set({name,vol:$("#npVol").value.trim(),cat,shape:$("#npShape").value,cost:num($("#npCost").value)||null,pack:parseInt($("#npPack").value)||null,color:$("#npColor").value,order:cat==="sale"?50:cat==="free"?70:90,min:cat==="shared"?1:6});toast("Добавлено в меню")}
  catch(e){toast("Не сохранилось: "+e.code)}
}

/* ---------- данные ---------- */
function onErr(e){if(e.code==="revoked"||e.code==="not_granted"){$("#view").innerHTML=`<div class="empty">Нет доступа к складу.</div>`}}
(async()=>{
  const db=window.claude?.use?await window.claude.use("db"):null;
  if(!db){$("#view").innerHTML=`<div class="empty">Склад открывается только в Claude — здесь нет доступа к общим данным.</div>`;$("#lastCount").textContent="";return}
  S.db=db;
  const snap=(col,key)=>db.collection(col).onSnapshot(q=>{S[key]=q.docs.map(d=>({id:d.id,...d.data()}));S.ready[key]=1;if(S.tab!=="count"||!document.activeElement?.matches("input"))render()},onErr);
  snap("products","products");snap("counts","counts");snap("purchases","purchases");
})();
})();
</script>
